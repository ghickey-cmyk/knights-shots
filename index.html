<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knights Shots">
<meta name="theme-color" content="#1a0f2e">
<title>Knights Shot Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#130b22; --panel:#1d1235; --panel2:#281849; --line:#3b2a60;
  --purple:#5b2ea6; --purple2:#8a5cff; --text:#f4effd; --muted:#ab9dc8;
  --green:#22c55e; --red:#ef4444; --gold:#f5c542;
  --floor:#21143b; --lane:#2d1a52; --courtline:rgba(255,255,255,.82);
  --head:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body)}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:linear-gradient(90deg,#2b1552,#170d2b);border-bottom:2px solid var(--purple);position:sticky;top:0;z-index:20}
header img{width:46px;height:46px;border-radius:9px;flex:none}
header h1{font-family:var(--head);font-weight:800;font-size:25px;line-height:1;margin:0;letter-spacing:.02em}
header .sub{font-size:13px;color:var(--muted);margin-top:2px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
nav button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 15px;border-radius:9px;font-family:var(--head);font-weight:700;font-size:17px}
nav button.on{background:var(--purple);border-color:var(--purple2);color:#fff}
main{padding:12px 14px 28px;max-width:1500px;margin:0 auto}
.view{display:none}.view.on{display:block}
.muted{color:var(--muted)}
h2{font-family:var(--head);font-weight:800;font-size:28px;margin:4px 0 6px}
h3{font-family:var(--head);font-weight:700;font-size:21px;margin:0 0 8px}

/* ---------- TRACK ---------- */
.track{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.daybar{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 6px;font-size:15px}
.daybar b{font-family:var(--head);font-size:20px}
.courtwrap{background:var(--panel);border-radius:14px;padding:8px;border:2px solid var(--line);transition:border-color .15s}
.courtwrap.flash-make{border-color:var(--green)}
.courtwrap.flash-miss{border-color:var(--red)}
#court{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.floor{fill:var(--floor)}
.cl rect,.cl circle,.cl line,.cl path{fill:none;stroke:var(--courtline);stroke-width:.22}
.cl .lane{fill:var(--lane)}
.cl .rim{stroke:#ff8a3d;stroke-width:.3}
.pendmark{fill:rgba(245,197,66,.3);stroke:var(--gold);stroke-width:.35}
@media (prefers-reduced-motion:no-preference){.pendmark{animation:pulse 1s ease-in-out infinite alternate}}
@keyframes pulse{from{r:.9}to{r:1.4}}

.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.status{grid-column:1/-1;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.status .who{font-family:var(--head);font-weight:800;font-size:24px;min-width:120px}
.status .who .warn{color:var(--gold);font-size:19px}
.status .what{flex:1;font-size:17px;color:var(--muted)}
.status .what b{color:var(--text);font-family:var(--head);font-size:22px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 14px;font-weight:600;font-size:15px}
.chip:disabled{opacity:.35}
.big{border:none;border-radius:14px;font-family:var(--head);font-weight:800;font-size:34px;padding:18px 0;color:#fff}
.big.make{background:var(--green);color:#052e14}
.big.miss{background:var(--red)}
.big.dim{opacity:.35}
.undo{background:var(--panel2);border:1px solid var(--line);border-radius:14px;font-weight:700;font-size:18px}

aside.rosterpanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
aside.rosterpanel h3{margin:2px 4px 8px}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--panel2);border:2px solid transparent;border-radius:11px;padding:10px 11px;text-align:left;min-height:62px}
.pbtn .pn{font-family:var(--head);font-weight:800;font-size:22px;line-height:1}
.pbtn .ps{font-size:13px;color:var(--muted)}
.pbtn.on{background:var(--purple);border-color:var(--gold)}
.pbtn.on .ps{color:#e7dcff}

@media (max-width:980px){.track{grid-template-columns:1fr}.roster{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
@media (max-width:620px){nav button{padding:7px 10px;font-size:15px}header h1{font-size:21px}.big{font-size:26px}}

/* ---------- TABLES / STATS ---------- */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{background:transparent;border:none;padding:8px 13px;border-radius:8px;font-weight:600;color:var(--muted);font-size:15px}
.seg button.on{background:var(--purple);color:#fff}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--head);font-weight:700;font-size:17px;color:var(--muted);background:var(--panel2)}
th[data-sort]{cursor:pointer}
th.sorted{color:var(--gold)}
tbody tr[data-goto]{cursor:pointer}
tbody tr[data-goto]:hover{background:rgba(138,92,255,.08)}
td.name{font-family:var(--head);font-weight:700;font-size:20px}
td b{font-size:17px}
td small{color:var(--muted);margin-left:6px;font-size:13px}
tr.total td{background:var(--panel2);font-weight:600}
.dash{color:var(--line)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-weight:700;font-size:13px}
.badge.green{background:rgba(34,197,94,.18);color:#6ee7a0;border:1px solid rgba(34,197,94,.5)}
.badge.red{background:rgba(239,68,68,.16);color:#fca5a5;border:1px solid rgba(239,68,68,.5)}
.badge.pending{background:transparent;color:var(--muted);border:1px dashed var(--line)}

/* ---------- CLUBS ---------- */
.clubtop{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.rules{color:var(--muted);font-size:15px;margin-bottom:12px}
.clubs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.club{border-radius:14px;padding:14px;border:2px solid}
.club.green{border-color:var(--green);background:linear-gradient(180deg,rgba(34,197,94,.13),rgba(34,197,94,.03))}
.club.red{border-color:var(--red);background:linear-gradient(180deg,rgba(239,68,68,.13),rgba(239,68,68,.03))}
.club h3{font-size:30px;font-weight:800}
.club.green h3{color:#6ee7a0}.club.red h3{color:#fca5a5}
.ccard{display:grid;grid-template-columns:1fr auto;align-items:center;background:rgba(0,0,0,.22);border-radius:10px;padding:10px 12px;margin-top:8px}
.ccard .cn{font-family:var(--head);font-weight:800;font-size:24px}
.ccard .cp{font-family:var(--head);font-weight:800;font-size:30px;text-align:right}
.ccard .cm{font-size:14px;color:var(--muted)}
.ccard .cd{font-size:14px;text-align:right;font-weight:600}
.cd.up{color:#6ee7a0}.cd.down{color:#fca5a5}
.empty{color:var(--muted);font-size:15px;padding:10px 2px}
.waiting{margin-top:14px;background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:12px 14px}
.waiting .wchips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{background:var(--panel2);border-radius:9px;padding:7px 11px;font-size:15px}
.wchip b{font-family:var(--head);font-size:18px;margin-right:6px}
.tagline{margin:22px auto 4px;text-align:center;font-family:var(--head);font-weight:700;font-size:19px;color:var(--muted);max-width:760px;line-height:1.3}
@media (max-width:700px){.clubs{grid-template-columns:1fr}}

/* ---------- PLAYER ---------- */
.ptop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
select,input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-size:17px;font-family:var(--body)}
.pselect{font-family:var(--head);font-weight:800;font-size:22px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.scard .k{font-size:14px;color:var(--muted)}
.scard .v{font-family:var(--head);font-weight:800;font-size:32px;line-height:1.1}
.scard .s{font-size:14px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
svg.half{width:100%;max-width:520px;display:block;margin:0 auto}
.legend{display:flex;gap:16px;justify-content:center;font-size:14px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
svg.trend{width:100%;height:auto;display:block}
.trend .grid{stroke:var(--line);stroke-width:1}
.trend .axis{fill:var(--muted);font-size:12px;font-family:var(--body)}
.trend .thr{stroke:var(--green);stroke-dasharray:5 5;stroke-width:1.5;opacity:.7}
.trend .l3{fill:none;stroke:var(--gold);stroke-width:3}
.trend .l3-pt{fill:var(--gold)}
.trend .l2{fill:none;stroke:var(--purple2);stroke-width:3}
.trend .l2-pt{fill:var(--purple2)}
@media (max-width:900px){.pgrid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}

/* ---------- SETUP ---------- */
.setup{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.rrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.rrow input[type=text]{flex:1;min-width:0}
.tog{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);white-space:nowrap}
.tog input{width:22px;height:22px;accent-color:var(--purple2)}
.btn{background:var(--purple);border:1px solid var(--purple2);color:#fff;border-radius:9px;padding:10px 15px;font-weight:600;font-size:15px}
.btn.ghost{background:var(--panel2);border-color:var(--line)}
.btn.danger{background:transparent;border-color:var(--red);color:#fca5a5}
.xbtn{background:transparent;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;color:var(--muted);font-size:18px;flex:none}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.field input{width:90px;text-align:center}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.log{max-height:380px;overflow-y:auto;margin-top:8px}
.lrow{display:grid;grid-template-columns:78px 1fr 110px 60px 40px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.lrow .r-m{color:#6ee7a0;font-weight:700}.lrow .r-x{color:#fca5a5;font-weight:700}
.note{font-size:14px;color:var(--muted);line-height:1.45}
@media (max-width:900px){.setup{grid-template-columns:1fr}}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#fff;color:#1a0f2e;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  @page{margin:.5in}
  body{background:#fff;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header,.noprint,#toast{display:none!important}
  .view{display:none!important}
  #v-clubs.view{display:block!important}
  main{padding:0}
  .printhead{display:flex!important;align-items:center;gap:12px;margin-bottom:10px}
  .printhead img{width:60px;height:60px;border-radius:8px}
  h2{color:#2b1552}
  .rules,.empty,.ccard .cm,.tagline{color:#444}
  .club{break-inside:avoid}
  .ccard{background:#f5f2fa}
  .ccard .cn,.ccard .cp{color:#111}
  .club.green h3{color:#15803d}.club.red h3{color:#b91c1c}
  .waiting{background:#fff;border-color:#bbb}
  .wchip{background:#eee;color:#111}
  .cd.up{color:#15803d}.cd.down{color:#b91c1c}
  .tagline{color:#2b1552}
}
.printhead{display:none}

/* ---------- v2 additions ---------- */
.sync{margin-left:auto;border-radius:20px;padding:7px 13px;font-size:14px;font-weight:600;border:1px solid var(--line);background:transparent;white-space:nowrap}
.sync.ok{color:#6ee7a0;border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
.sync.wait{color:var(--gold);border-color:rgba(245,197,66,.55);background:rgba(245,197,66,.1)}
.sync.busy{color:var(--muted)}
.sync.off{color:var(--muted);border-style:dashed}
nav{margin-left:8px}
#court{max-height:calc(100vh - 345px)}
.pbtn .ps{white-space:nowrap}
.ftmode #court{opacity:.3}
.ftbanner{display:none;text-align:center;font-family:var(--head);font-weight:800;font-size:26px;color:var(--gold);padding:6px 0 0}
.ftmode .ftbanner{display:block}
.chip.on{background:var(--gold);color:#1a0f2e;border-color:var(--gold)}
.statusbtns{display:flex;gap:8px}
.key{display:block;font-family:var(--body);font-size:13px;font-weight:600;opacity:.75;margin-top:1px}
.big{padding:12px 0}
.shortcuts{grid-column:1/-1;font-size:14px;color:var(--muted);text-align:center}
.shortcuts kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel2);color:var(--text);font-family:var(--body);font-weight:700;font-size:13px;margin:0 3px 0 10px}
.urlrow{display:flex;gap:8px;margin:8px 0}
.urlrow input{flex:1;min-width:0;font-size:14px}
@media (max-width:1100px){.sync{font-size:12px;padding:6px 10px}}
.trend .lf{fill:none;stroke:#d9d0ec;stroke-width:2;stroke-dasharray:6 4}
.trend .lf-pt{fill:#d9d0ec}
.cards{grid-template-columns:repeat(5,1fr)}
@media (max-width:900px){.cards{grid-template-columns:1fr 1fr}}

/* ---------- v3: Reagan flow, full screen, bigger court ---------- */
.track{grid-template-columns:minmax(0,1fr) 272px;gap:12px}
#court{max-height:calc(100vh - 240px)}
#toast{bottom:auto;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-12px)}
#toast.on{transform:translateX(-50%) translateY(0)}
:fullscreen{background:var(--bg);overflow:auto}
.courtwrap{padding:6px}
.actions{grid-template-columns:minmax(0,1fr) 150px 150px 112px;gap:8px;margin-top:8px}
.actions .status{grid-column:auto;min-height:0;padding:8px 12px;flex-wrap:wrap}
.status .what{font-size:16px;color:var(--text)}
.status .what .step{color:var(--gold);font-weight:600}
.status .last{width:100%;font-size:13px;color:var(--muted)}
.big{font-size:30px;padding:8px 0}
.big.picked{outline:4px solid var(--gold);outline-offset:3px}
.undo{font-size:16px}
.shortcuts{font-size:13px}
.rosterpanel{transition:border-color .15s,box-shadow .15s}
.rosterpanel.ask{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.rosterpanel.ask h3{color:var(--gold)}
.pbtn{min-height:58px;padding:8px 10px}
.pbtn:hover{border-color:var(--purple2)}
.daybar .hi{font-family:var(--head);font-weight:700;font-size:20px}
.fsbtn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 12px;font-weight:600;font-size:14px;margin-left:8px;white-space:nowrap}
.sidetbl td:first-child{font-weight:600}
.half text{fill:var(--muted);font-family:var(--head);font-weight:700;font-size:2.2px}
@media (max-width:980px){.actions{grid-template-columns:1fr 1fr 1fr}.actions .status{grid-column:1/-1}#court{max-height:none}}
.fadeout{animation:fadeout 1.5s ease-in forwards}
@keyframes fadeout{0%{opacity:1}60%{opacity:.8}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fadeout{animation:none}}

/* ---------- v4: hype callouts + today's leaders ---------- */
.rightcol{display:flex;flex-direction:column;gap:10px}
.leaders{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.leaders h3{margin:2px 0 6px}
.lb{margin-bottom:8px}
.lb .lt{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.lb .lr{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;padding:2px 0}
.lb .lr b{font-family:var(--head);font-weight:800;font-size:19px}
.lb .lr .rk{color:var(--gold);font-family:var(--head);font-weight:800;margin-right:6px}
.lb .lr span:last-child{color:var(--muted);font-size:14px}
.lb .none{font-size:14px;color:var(--muted)}
.bchips{display:flex;flex-wrap:wrap;gap:5px}
.bchip{background:var(--panel2);border-radius:8px;padding:4px 8px;font-size:14px;font-weight:600}
.pbtn .pn{white-space:nowrap}
.pn .fl{font-size:.8em;margin-left:4px}
.pbtn.fire{background:linear-gradient(180deg,rgba(255,122,26,.28),var(--panel2));box-shadow:0 0 18px rgba(255,122,26,.7)}
.pbtn.hot{border-color:#ff7a1a;box-shadow:0 0 12px rgba(255,122,26,.45)}
.pbtn.hot.on{border-color:var(--gold)}
#hype{position:fixed;inset:0;z-index:60;pointer-events:none;display:grid;place-items:center;opacity:0;visibility:hidden}
#hype.on{visibility:visible;animation:hypeIn var(--dur,2.4s) ease-out forwards}
#hype.big{background:radial-gradient(circle at 50% 50%,rgba(43,21,82,.92) 0%,rgba(19,11,34,.88) 60%,rgba(19,11,34,.7) 100%)}
#hype.small{place-items:start center;padding-top:calc(90px + env(safe-area-inset-top))}
.hy{text-align:center;font-family:var(--head);line-height:.95;text-transform:uppercase}
.hy .ic{font-size:110px;line-height:1}
.hy .nm{font-weight:800;font-size:clamp(70px,11vw,170px);letter-spacing:.01em;color:#fff}
.hy .tt{font-weight:800;font-size:clamp(56px,8vw,130px);background:linear-gradient(180deg,#ffe066,#ff7a1a 55%,#e8361a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hy.green .tt{background:linear-gradient(180deg,#b9f6cf,#22c55e)}
.hy.sniper .tt{background:linear-gradient(180deg,#fff,#b79bff 60%,#8a5cff)}
.hy.auto .tt{background:linear-gradient(180deg,#fff3c4,#f5c542)}
.hy .sb{font-family:var(--body);font-weight:600;font-size:clamp(18px,2vw,28px);color:var(--muted);text-transform:none;margin-top:14px}
#hype.small .hy{background:linear-gradient(90deg,#ff7a1a,#e8361a);border-radius:16px;padding:10px 26px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#hype.small .hy .ic{display:inline;font-size:38px}
#hype.small .hy .nm,#hype.small .hy .tt{display:inline;font-size:44px;color:#fff;background:none;-webkit-background-clip:initial;background-clip:initial}
#hype.small .hy .sb{display:none}
@keyframes hypeIn{0%{opacity:0;transform:scale(.85)}12%{opacity:1;transform:scale(1.04)}20%{transform:scale(1)}82%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#hype.on{animation:hypeFade var(--dur,2.4s) linear forwards}}
@keyframes hypeFade{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
.badgerow{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 12px}
.badgerow .bchip{font-size:15px;padding:6px 11px}

.modeseg{display:inline-flex;margin-left:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.modeseg button{background:transparent;border:none;border-radius:7px;padding:6px 11px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.modeseg button.on{background:var(--purple);color:#fff}
body:not(.board) #soundBtn,body:not(.board) #leaders{display:none}
body.board .lb .lr{font-size:18px}
body.board .lb .lr b{font-size:22px}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="Westbrook Knights crest">
  <div>
    <h1>Knights Shot Tracker</h1>
    <div class="sub" id="subLbl">Westbrook Knights practice shooting</div>
  </div>
  <button class="sync off" id="sync" title="Click to save now">Drive not connected</button>
  <div class="modeseg" role="group" aria-label="Display mode"><button data-mode="laptop">MacBook</button><button data-mode="board">Smart board</button></div>
  <button class="fsbtn" id="soundBtn">Sound on</button>
  <button class="fsbtn" id="fsBtn">Full screen</button>
  <nav id="nav" aria-label="Sections">
    <button data-v="track" class="on">Track</button>
    <button data-v="stats">Stats</button>
    <button data-v="clubs">Clubs</button>
    <button data-v="player">Player</button>
    <button data-v="setup">Setup</button>
  </nav>
</header>

<main>
  <section id="v-track" class="view on">
    <div class="track">
      <div>
        <div class="daybar"><span><span class="hi" id="hiLbl"></span> <span class="muted" id="todayLbl"></span></span><span id="todayCount" class="muted"></span></div>
        <div class="courtwrap" id="courtwrap">
          <svg id="court" viewBox="-0.6 -0.6 95.2 51.2" aria-label="Full court. Click where the shot was taken.">
            <rect class="floor" x="-0.6" y="-0.6" width="95.2" height="51.2" rx="1"/>
            <g class="cl" id="courtLines"></g>
            <g id="dots"></g>
          </svg>
          <div class="ftbanner">Free throws: make or miss, then the shooter</div>
        </div>
        <div class="actions">
          <div class="status">
            <div class="what" id="pend"></div>
            <div class="statusbtns">
              <button class="chip" id="typeBtn" disabled>2 / 3</button>
              <button class="chip" id="ftBtn">Free throws</button>
            </div>
            <div class="last" id="lastLbl"></div>
          </div>
          <button class="big make" id="makeBtn">MAKE<span class="key">M key</span></button>
          <button class="big miss" id="missBtn">MISS<span class="key">N key</span></button>
          <button class="undo" id="undoBtn">Undo last<span class="key">Z key</span></button>
          <div class="shortcuts">Spot, then make or miss, then the shooter.<kbd>M</kbd>make<kbd>N</kbd>miss<kbd>F</kbd>free throws on/off<kbd>T</kbd>switch 2/3<kbd>Z</kbd>undo</div>
        </div>
      </div>
      <div class="rightcol">
        <aside class="rosterpanel">
          <h3 id="rosterTitle">Shooters</h3>
          <div class="roster" id="roster"></div>
        </aside>
        <section class="leaders" id="leaders"></section>
      </div>
    </div>
  </section>

  <section id="v-stats" class="view"></section>
  <section id="v-clubs" class="view"></section>
  <section id="v-player" class="view"></section>
  <section id="v-setup" class="view"></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="hype" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* Paste the Google Apps Script web app URL between the quotes below. */
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwM4FDu3pCFbxILVwDoa6SqpF0j-Qc7QzFAPPCdEqNtGOO9UC1VNPp9WPWUVrWvRiB_CA/exec';

const LS='knightsShotTracker_v2';
const DEFAULT_ROSTER=['Greg','Ryan','Griffin','Anthony','Tavin','Dylan','Drew','Josh','Jason'];
const TAGLINE='We are resilient, we are disciplined, we are relentless, we are united...we are Knights.';
const RIM=5.25, R3=19.75; // NFHS: rim center 5'3" from baseline, 3PT line 19'9"
const ZONES=['Rim','Paint','Midrange','Corner 3','Wing 3','Top 3'];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>dayKey(new Date());
const daysAgoKey=n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return dayKey(d);};
const prettyDay=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});};
const shortDay=k=>{const p=k.split('-');return (+p[1])+'/'+(+p[2]);};
const timeOf=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});

/* ---------- storage ---------- */
function fresh(){return {players:DEFAULT_ROSTER.map((n,i)=>({id:'p'+(i+1),name:n,active:true})),shots:[],pendingDeletes:[],playersDirty:true,rosterFresh:true,settings:{green:33,min:10,window:14,sheetUrl:'',manager:'Reagan',sound:true,mode:'laptop'}};}
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(LS));
    if(r&&Array.isArray(r.players)){
      r.shots=Array.isArray(r.shots)?r.shots:[];r.pendingDeletes=Array.isArray(r.pendingDeletes)?r.pendingDeletes:[];
      r.settings=Object.assign({green:33,min:10,window:14,sheetUrl:'',manager:'Reagan',sound:true,mode:'laptop'},r.settings||{});return r;
    }
  }catch(e){}
  return fresh();
}
let S=load();
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){toast('Could not save on this computer');}}
function pname(id){const p=S.players.find(p=>p.id===id);return p?p.name:'(removed)';}
function rosterChanged(){S.playersDirty=true;S.rosterFresh=false;save();scheduleSync();}

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);}

/* ---------- geometry ---------- */
function isThree(d,lat){return d<=RIM?Math.abs(lat)>R3:Math.hypot(d-RIM,lat)>R3;}
function typeLabel(t){return t==='FT'?'FT':t+'PT';}
function zoneOf(s){
  if(s.type==='FT')return 'Free throw';
  const d=s.d,lat=s.lat;
  if(s.type==='3'){if(d<=14)return 'Corner 3';if(Math.abs(lat)<=8)return 'Top 3';return 'Wing 3';}
  if(Math.hypot(d-RIM,lat)<=4)return 'Rim';
  if(Math.abs(lat)<=6&&d<=19)return 'Paint';
  return 'Midrange';
}
function endLines(){
  return '<rect class="lane" x="0" y="19" width="19" height="12"/>'+
    '<circle cx="19" cy="25" r="6"/>'+
    '<line x1="4" y1="22" x2="4" y2="28"/>'+
    '<circle class="rim" cx="5.25" cy="25" r=".75"/>'+
    '<path d="M0 5.25 L5.25 5.25 A19.75 19.75 0 0 1 5.25 44.75 L0 44.75"/>';
}
function drawCourt(){
  $('#courtLines').innerHTML=
    '<rect x="0" y="0" width="94" height="50"/>'+
    '<line x1="47" y1="0" x2="47" y2="50"/>'+
    '<circle cx="47" cy="25" r="6"/>'+
    '<image href="icon-192.png" x="42" y="20" width="10" height="10" opacity=".55"/>'+
    '<g>'+endLines()+'</g>'+
    '<g transform="rotate(180 47 25)">'+endLines()+'</g>';
}
function dotSVG(x,y,made,op,r){
  op=op==null?1:op;r=r||.7;
  if(made)return `<circle cx="${x}" cy="${y}" r="${r}" fill="#22c55e" stroke="#063b19" stroke-width=".15" opacity="${op}"/>`;
  const k=r*.8;
  return `<g opacity="${op}" stroke="#ef4444" stroke-width=".38" stroke-linecap="round"><line x1="${x-k}" y1="${y-k}" x2="${x+k}" y2="${y+k}"/><line x1="${x-k}" y1="${y+k}" x2="${x+k}" y2="${y-k}"/></g>`;
}

/* ---------- stats helpers ---------- */
function agg(sh){
  const a={m2:0,a2:0,m3:0,a3:0,mf:0,af:0};
  for(const s of sh){if(s.type==='FT'){a.af++;if(s.made)a.mf++;}else if(s.type==='3'){a.a3++;if(s.made)a.m3++;}else{a.a2++;if(s.made)a.m2++;}}
  a.m=a.m2+a.m3;a.a=a.a2+a.a3;return a;
}
function pctNum(m,a){return a?m/a*100:null;}
function cell(m,a){return a?`<b>${Math.round(m/a*100)}%</b><small>${m}/${a}</small>`:'<span class="dash">—</span>';}
function sideOf(s){if(s.type==='FT'||s.lat==null)return null;if(Math.abs(s.lat)<=3)return 'Middle';return s.lat<0?'Right':'Left';}
function rangeShots(range){
  if(range==='today'){const k=todayKey();return S.shots.filter(s=>s.day===k);}
  if(range==='window'){const k=daysAgoKey(S.settings.window-1);return S.shots.filter(s=>s.day>=k);}
  return S.shots;
}
function windowThrees(pid,offset){
  const w=S.settings.window;offset=offset||0;
  const start=daysAgoKey(offset+w-1),end=daysAgoKey(offset);
  return S.shots.filter(s=>s.p===pid&&s.type==='3'&&s.day>=start&&s.day<=end);
}
function club(pid){
  const sh=windowThrees(pid);const m=sh.filter(s=>s.made).length,a=sh.length;
  if(a<S.settings.min)return {status:'pending',m,a,p:pctNum(m,a)};
  const p=m/a*100;return {status:p>=S.settings.green?'green':'red',m,a,p};
}
function badge(c){
  if(c.status==='green')return '<span class="badge green">Green Club</span>';
  if(c.status==='red')return '<span class="badge red">Red Club</span>';
  return `<span class="badge pending">${c.a}/${S.settings.min} 3PA</span>`;
}

/* ---------- navigation ---------- */
let view='track';
function show(v){
  view=v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  render();window.scrollTo(0,0);
}
function renderMgr(){const m=mgr();$('#subLbl').textContent=m?`Tracked by ${m}, team manager`:'Westbrook Knights practice shooting';}
function render(){renderMgr();renderSound();renderMode();({track:renderTrack,stats:renderStats,clubs:renderClubs,player:renderPlayer,setup:renderSetup})[view]();updateSync();}

/* ---------- TRACK ---------- */
let pending=null,pendingMade=null,ftMode=false,lastLogged=null,justLogged=null,justT=null;
const MILESTONES=[100,250,500,750,1000,1500,2000,2500,3000,4000,5000,6000,7500,10000];
function mgr(){return (S.settings.manager||'').trim();}
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}
function renderTrack(){
  const tk=todayKey();const today=S.shots.filter(s=>s.day===tk);
  const m=mgr();
  $('#hiLbl').textContent=m?`${greeting()}, ${m}.`:'';
  $('#todayLbl').textContent=prettyDay(tk);
  $('#todayCount').textContent=`${today.length} today, ${S.shots.length.toLocaleString()} this season`;
  const act=S.players.filter(p=>p.active);
  $('#roster').innerHTML=act.map(p=>{
    const a=agg(today.filter(s=>s.p===p.id));
    const st=runEnd(today.filter(s=>s.p===p.id&&s.type!=='FT'));
    const fl=st>=3?'<span class="fl">🔥</span>':'';
    return `<button class="pbtn${st>=5?' hot fire':st>=3?' hot':''}" data-pick="${p.id}"><span class="pn">${esc(p.name)}${fl}</span><span class="ps">3s ${a.m3}/${a.a3} &nbsp; 2s ${a.m2}/${a.a2}</span><span class="ps">FT ${a.mf}/${a.af}</span></button>`;
  }).join('')||'<div class="empty">No active players. Add or activate players in Setup.</div>';
  renderLeaders(today);
  const flash=justLogged&&justLogged.type!=='FT'?`<g class="fadeout">${dotSVG(justLogged.X,justLogged.Y,justLogged.made)}</g>`:'';
  $('#dots').innerHTML=flash+
    (pending&&!ftMode?`<circle class="pendmark" cx="${pending.X}" cy="${pending.Y}" r="1.1"/>`:'');
  renderPending();
}
function renderPending(){
  $('#courtwrap').classList.toggle('ftmode',ftMode);
  $('#ftBtn').classList.toggle('on',ftMode);
  $('#ftBtn').textContent=ftMode?'Free throws on':'Free throws';
  const tb=$('#typeBtn');
  const base=ftMode?'Free throw':pending?`${typeLabel(pending.type)} ${zoneOf(pending)}`:null;
  if(!base){$('#pend').innerHTML='<span class="step">Click where the shot was taken</span>';}
  else if(pendingMade==null){$('#pend').innerHTML=`<b>${base}</b> &nbsp;<span class="step">Make or miss?</span>`;}
  else{$('#pend').innerHTML=`<b>${base}, ${pendingMade?'make':'miss'}</b> &nbsp;<span class="step">Who shot it?</span>`;}
  if(!ftMode&&pending){tb.disabled=false;tb.textContent='Make it a '+(pending.type==='3'?'2':'3');}else{tb.disabled=true;tb.textContent='2 / 3';}
  $('#makeBtn').classList.toggle('dim',!base);$('#missBtn').classList.toggle('dim',!base);
  $('#makeBtn').classList.toggle('picked',pendingMade===true);$('#missBtn').classList.toggle('picked',pendingMade===false);
  const ask=pendingMade!=null;
  $('.rosterpanel').classList.toggle('ask',ask);
  $('#rosterTitle').textContent=ask?'Who shot it?':'Shooters';
  $('#lastLbl').textContent=lastLogged?`Last logged: ${pname(lastLogged.p)}, ${typeLabel(lastLogged.type)} ${lastLogged.made?'make':'miss'}`:'';
}
function courtTap(e){
  keepAwake();
  if(ftMode){ftMode=false;} // clicking the court ends free throw mode
  const svg=$('#court');const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const X=clamp(p.x,0,94),Y=clamp(p.y,0,50);
  let d,lat;
  if(X<=47){d=X;lat=Y-25;}else{d=94-X;lat=25-Y;} // fold far end onto near end; lat < 0 is the shooter's right
  pending={X:r1(X),Y:r1(Y),d:r1(d),lat:r1(lat),type:isThree(d,lat)?'3':'2'};
  pendingMade=null;justLogged=null;
  renderTrack();
}
function toggleFT(){ftMode=!ftMode;pending=null;pendingMade=null;renderTrack();}
function flipType(){if(pending&&!ftMode){pending.type=pending.type==='3'?'2':'3';renderPending();}}
function chooseResult(made){
  if(!ftMode&&!pending){toast('Click where the shot was taken first');return;}
  pendingMade=!!made;keepAwake();renderPending();
}
function pickPlayer(pid){
  if(!ftMode&&!pending){toast('Click where the shot was taken first');return;}
  if(pendingMade==null){toast('Choose make or miss first');return;}
  const now=new Date();
  const base=ftMode?{type:'FT',X:null,Y:null,d:null,lat:null}:{type:pending.type,X:pending.X,Y:pending.Y,d:pending.d,lat:pending.lat};
  const shot=Object.assign({id:uid(),p:pid,made:pendingMade,t:now.getTime(),day:dayKey(now),synced:false},base);
  const wasGreen=club(pid).status==='green';
  S.shots.push(shot);save();
  detectHype(shot,wasGreen);
  lastLogged=shot;justLogged=shot;clearTimeout(justT);justT=setTimeout(()=>{justLogged=null;if(view==='track')renderTrack();},1600);
  const made=pendingMade;pending=null;pendingMade=null;
  const w=$('#courtwrap');w.classList.remove('flash-make','flash-miss');void w.offsetWidth;w.classList.add(made?'flash-make':'flash-miss');
  setTimeout(()=>w.classList.remove('flash-make','flash-miss'),350);
  renderTrack();scheduleSync();
  const n=S.shots.length;
  if(MILESTONES.includes(n)){const m=mgr();toast(`${m?m+', that':'That'}'s ${n.toLocaleString()} shots logged this season!`);}
}
/* ---------- streaks, badges, callouts ---------- */
function byTime(a,b){return a.t-b.t;}
function runEnd(sh){const s=sh.slice().sort(byTime);let c=0;for(let i=s.length-1;i>=0;i--){if(s[i].made)c++;else break;}return c;}
function runMax(sh){const s=sh.slice().sort(byTime);let c=0,m=0;for(const x of s){c=x.made?c+1:0;if(c>m)m=c;}return m;}
const awarded=new Set();
function detectHype(shot,wasGreen){
  if(S.settings.mode!=='board')return;
  const pid=shot.p,day=shot.day,mine=S.shots.filter(s=>s.p===pid&&s.day===day);
  const key=b=>day+'|'+pid+'|'+b;
  const once=b=>{if(awarded.has(key(b)))return false;awarded.add(key(b));return true;};
  const ev=[];
  if(shot.made&&shot.type!=='FT'){
    const st=runEnd(mine.filter(s=>s.type!=='FT'));
    if(st===3)ev.push('heat');else if(st===5)ev.push('fire');else if(st===10)ev.push('unstop');
    if(shot.type==='3'&&mine.filter(s=>s.type==='3'&&s.made).length===5&&once('sniper'))ev.push('sniper');
  }
  if(shot.made&&shot.type==='FT'&&runEnd(mine.filter(s=>s.type==='FT'))===10&&once('auto'))ev.push('auto');
  if(shot.type==='3'&&!wasGreen&&club(pid).status==='green')ev.push('green');
  ev.forEach(e=>queueHype(e,pname(pid)));
}
const HYPE={
  heat:{small:true,ic:'🔥',tt:'is heating up',lines:['{n} is heating up!','{n}, heating up!','Here comes {n}!']},
  fire:{ic:'🔥',tt:'is on fire',sb:'5 straight makes',lines:['{n} is on fire!','{n} is ON FIRE!','Somebody stop {n}! He is on fire!']},
  unstop:{ic:'🔥',tt:'can’t miss',sb:'10 straight makes',lines:['{n} cannot miss!','Ten in a row for {n}! Unbelievable!']},
  sniper:{cls:'sniper',ic:'🎯',tt:'Sniper',sb:'5 threes made today',lines:['Sniper! {n} has five threes today!','{n} is a sniper from deep!']},
  auto:{cls:'auto',ic:'💯',tt:'Automatic',sb:'10 straight free throws',lines:['Automatic! Ten straight free throws for {n}!','{n} is automatic at the line!']},
  green:{cls:'green',ic:'🟢',tt:'Green Club',sb:'Welcome to the Green Club',lines:['{n} just made the Green Club!','Green light for {n}! Welcome to the Green Club!']}
};
const hypeQ=[];let hypeBusy=false;
function queueHype(kind,name){hypeQ.push({kind,name});if(!hypeBusy)nextHype();}
function nextHype(){
  const it=hypeQ.shift();const el=$('#hype');
  if(!it){hypeBusy=false;el.className='';el.innerHTML='';return;}
  hypeBusy=true;const h=HYPE[it.kind];const dur=h.small?1.8:2.6;
  el.className='';void el.offsetWidth;
  el.style.setProperty('--dur',dur+'s');
  el.innerHTML=`<div class="hy ${h.cls||''}"><div class="ic">${h.ic}</div> <div class="nm">${esc(it.name)}</div> <div class="tt">${h.tt}</div>${h.sb?`<div class="sb">${h.sb}</div>`:''}</div>`;
  el.className='on '+(h.small?'small':'big');
  say(h.lines[Math.floor(Math.random()*h.lines.length)].replace('{n}',it.name));
  setTimeout(nextHype,dur*1000);
}
let voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();
  const pref=['Daniel','Alex','Aaron','Fred','Google US English','Samantha'];
  voice=pref.map(n=>vs.find(v=>v.name.indexOf(n)===0&&/^en/i.test(v.lang))).find(Boolean)||vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){
  if(!S.settings.sound||!('speechSynthesis' in window))return;
  try{const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.rate=1.08;u.pitch=.9;u.volume=1;speechSynthesis.speak(u);}catch(e){}
}
function renderMode(){const b=S.settings.mode==='board';document.body.classList.toggle('board',b);document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode===S.settings.mode));}
function renderSound(){$('#soundBtn').textContent=S.settings.sound?'Sound on':'Sound off';}
function renderLeaders(today){
  const act=S.players.filter(p=>p.active);
  const rows=act.map(p=>{const sh=today.filter(s=>s.p===p.id);const fg=sh.filter(s=>s.type!=='FT');
    return {p,a:agg(sh),cur:runEnd(fg),best:runMax(fg),ftBest:runMax(sh.filter(s=>s.type==='FT'))};});
  const lr=(r,i,val,sub)=>`<div class="lr"><span><span class="rk">${i+1}</span><b>${esc(r.p.name)}</b></span><span>${val}${sub?' '+sub:''}</span></div>`;
  const threes=rows.filter(r=>r.a.m3>0).sort((x,y)=>y.a.m3-x.a.m3||(y.a.m3/y.a.a3)-(x.a.m3/x.a.a3)).slice(0,3);
  const fgp=rows.filter(r=>r.a.a>=8).sort((x,y)=>(y.a.m/y.a.a)-(x.a.m/x.a.a)).slice(0,3);
  const hot=rows.filter(r=>r.cur>=3).sort((x,y)=>y.cur-x.cur);
  const badges=[];
  rows.forEach(r=>{if(r.best>=5)badges.push(`🔥 ${esc(r.p.name)} (On fire)`);if(r.a.m3>=5)badges.push(`🎯 ${esc(r.p.name)} (Sniper)`);if(r.ftBest>=10)badges.push(`💯 ${esc(r.p.name)} (Automatic)`);});
  $('#leaders').innerHTML=`<h3>Today’s leaders</h3>
    <div class="lb"><div class="lt">Threes made</div>${threes.length?threes.map((r,i)=>lr(r,i,`<b>${r.a.m3}</b>`,`of ${r.a.a3}`)).join(''):'<div class="none">No threes made yet</div>'}</div>
    <div class="lb"><div class="lt">Shooting % (8+ shots)</div>${fgp.length?fgp.map((r,i)=>lr(r,i,`<b>${Math.round(r.a.m/r.a.a*100)}%</b>`,'')).join(''):'<div class="none">Not enough shots yet</div>'}</div>
    <div class="lb"><div class="lt">Hot right now</div>${hot.length?`<div class="bchips">${hot.map(r=>`<span class="bchip">🔥 ${esc(r.p.name)} ${r.cur} straight</span>`).join('')}</div>`:'<div class="none">Nobody yet</div>'}</div>
    <div class="lb" style="margin-bottom:0"><div class="lt">Badges today</div>${badges.length?`<div class="bchips">${badges.map(b=>`<span class="bchip">${b}</span>`).join('')}</div>`:'<div class="none">None yet</div>'}</div>`;
}
function seasonBadges(pid){
  const out={fire:0,sniper:0,auto:0};
  const days=[...new Set(S.shots.filter(s=>s.p===pid).map(s=>s.day))];
  days.forEach(d=>{const sh=S.shots.filter(s=>s.p===pid&&s.day===d);
    if(runMax(sh.filter(s=>s.type!=='FT'))>=5)out.fire++;
    if(sh.filter(s=>s.type==='3'&&s.made).length>=5)out.sniper++;
    if(runMax(sh.filter(s=>s.type==='FT'))>=10)out.auto++;});
  return out;
}
function removeShots(pred){
  const gone=S.shots.filter(pred);
  S.shots=S.shots.filter(s=>!pred(s));
  gone.forEach(s=>{if(s.synced)S.pendingDeletes.push(s.id);});
  if(lastLogged&&gone.some(s=>s.id===lastLogged.id))lastLogged=null;
  save();scheduleSync();return gone;
}
function undo(){
  if(pending||pendingMade!=null){pending=null;pendingMade=null;renderTrack();toast('Cleared');return;}
  const tk=todayKey();let last=null;
  S.shots.forEach(s=>{if(s.day===tk&&(!last||s.t>last.t))last=s;});
  if(!last){toast('No shots to undo today');return;}
  removeShots(s=>s.id===last.id);renderTrack();
  toast(`Removed ${pname(last.p)} ${typeLabel(last.type)} ${last.made?'make':'miss'}`);
}

function clubLists(){
  const st=S.settings;const act=S.players.filter(p=>p.active);
  const list=act.map(p=>{
    const c=club(p.id);const prev=windowThrees(p.id,st.window);
    const pa=prev.length,pm=prev.filter(s=>s.made).length;
    const delta=(c.status!=='pending'&&pa>=st.min)?c.p-pm/pa*100:null;
    return {p,c,delta};
  });
  return {
    g:list.filter(x=>x.c.status==='green').sort((a,b)=>b.c.p-a.c.p),
    r:list.filter(x=>x.c.status==='red').sort((a,b)=>b.c.p-a.c.p),

/* ---------- Google Sheet sync ---------- */
function sheetUrl(){return (SHEET_URL||S.settings.sheetUrl||'').trim();}
let syncing=false,pulling=false,syncTimer=null,syncErr=null;
function scheduleSync(ms){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,ms==null?1200:ms);updateSync();}
function rowOf(s){return {id:s.id,day:s.day,time:timeOf(s.t),player:pname(s.p),pid:s.p,type:typeLabel(s.type),zone:zoneOf(s),result:s.made?'Make':'Miss',X:s.X,Y:s.Y,d:s.d,lat:s.lat,t:s.t};}
function waitingCount(){return S.shots.filter(s=>!s.synced).length+S.pendingDeletes.length;}
async function syncNow(){
  const url=sheetUrl();
  if(!url||syncing||pulling){updateSync();return;}
  const shots=S.shots.filter(s=>!s.synced).slice(0,400);
  const deletes=S.pendingDeletes.slice();
  const sendPlayers=S.playersDirty;
  if(!shots.length&&!deletes.length&&!sendPlayers){syncErr=null;updateSync();return;}
  if(!navigator.onLine){updateSync();return;}
  syncing=true;updateSync();
  if(sendPlayers)S.playersDirty=false;
  try{
    const body={shots:shots.map(rowOf),deletes};
    if(sendPlayers)body.players=S.players.map(p=>({id:p.id,name:p.name,active:p.active}));
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'Sheet error');
    const dset=new Set(deletes);S.pendingDeletes=S.pendingDeletes.filter(id=>!dset.has(id));
    const sent=new Set(shots.map(s=>s.id));const still=new Set();
    S.shots.forEach(s=>{if(sent.has(s.id)){s.synced=true;still.add(s.id);}});
    sent.forEach(id=>{if(!still.has(id))S.pendingDeletes.push(id);}); // undone while sending
    syncErr=null;S.settings.lastSync=Date.now();save();
  }catch(e){
    syncErr=String(e&&e.message||e);if(sendPlayers)S.playersDirty=true;save();
  }finally{
    syncing=false;updateSync();
    if(!syncErr&&(waitingCount()||S.playersDirty))scheduleSync(300);
  }
}
async function pullFromSheet(manual){
  const url=sheetUrl();
  if(!url){return;}
  if(!navigator.onLine){if(manual)toast('No wifi right now');return;}
  if(syncing){setTimeout(()=>pullFromSheet(manual),800);return;}
  pulling=true;updateSync();
  try{
    const res=await fetch(url+(url.indexOf('?')>-1?'&':'?')+'t='+Date.now());
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'Sheet error');
    const remote=new Map(j.shots.map(s=>[s.id,s]));
    const before=S.shots.length;
    S.shots=S.shots.filter(s=>!s.synced||remote.has(s.id)); // removed in the Sheet
    const removed=before-S.shots.length;
    const local=new Set(S.shots.map(s=>s.id)),pend=new Set(S.pendingDeletes);
    let added=0;
    j.shots.forEach(s=>{if(!local.has(s.id)&&!pend.has(s.id)){s.synced=true;S.shots.push(s);added++;}});
    if(j.players&&j.players.length){
      if(S.rosterFresh||!S.playersDirty){S.players=j.players;S.playersDirty=false;S.rosterFresh=false;}
      else{const ids=new Set(S.players.map(p=>p.id));j.players.forEach(p=>{if(!ids.has(p.id))S.players.push(p);});}
    }
    save();
    if(manual||added||removed)toast(`Drive checked: ${added} shots added${removed?', '+removed+' removed':''}`);
  }catch(e){if(manual)toast('Could not reach the Google Sheet');}
  finally{pulling=false;render();}
}
function updateSync(){
  const el=$('#sync');if(!el)return;
  const n=waitingCount();let cls,txt;
  if(!sheetUrl()){cls='off';txt='Drive not connected';}
  else if(syncing||pulling){cls='busy';txt='Saving to Drive…';}
  else if(n||S.playersDirty){cls='wait';txt=!navigator.onLine?`${n} waiting for wifi`:syncErr?`${n} waiting, retrying`:`${n} waiting to save`;}
  else{cls='ok';txt='All shots saved to Drive';}
  el.className='sync '+cls;el.textContent=txt;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,tr[data-goto],th[data-sort]');if(!t)return;
  const ds=t.dataset;
  if(ds.v){show(ds.v);return;}
  if(ds.mode){S.settings.mode=ds.mode;save();renderMode();if(view==='track')renderTrack();if(ds.mode==='board'&&S.settings.sound)say('Smart board mode. Let\'s go Knights!');toast(ds.mode==='board'?'Smart board mode: callouts and leaderboard on':'MacBook mode: callouts and sound off');return;}
  if(ds.pick){pickPlayer(ds.pick);return;}
  if(ds.sr){statRange=ds.sr;renderStats();return;}
  if(ds.sort){statSort=ds.sort;renderStats();return;}
  if(ds.goto){plId=ds.goto;show('player');return;}
  if(ds.pr){plRange=ds.pr;renderPlayer();return;}
  if(ds.delp){
    const p=S.players.find(x=>x.id===ds.delp);const n=S.shots.filter(s=>s.p===ds.delp).length;
    if(!confirm(n?`Delete ${p.name} and their ${n} logged shots? To keep their stats, uncheck Active instead.`:`Delete ${p.name}?`))return;
    S.players=S.players.filter(x=>x.id!==ds.delp);removeShots(s=>s.p===ds.delp);
    rosterChanged();renderSetup();toast(p.name+' deleted');return;
  }
  if(ds.dels){removeShots(s=>s.id===ds.dels);renderSetup();toast('Shot deleted');return;}
  switch(t.id){
    case 'sync':if(!sheetUrl())show('setup');else{syncNow();}break;
    case 'makeBtn':chooseResult(true);break;
    case 'missBtn':chooseResult(false);break;
    case 'fsBtn':toggleFS();break;
    case 'soundBtn':S.settings.sound=!S.settings.sound;save();renderSound();if(S.settings.sound)say('Sound on. Let\'s go Knights!');break;
    case 'undoBtn':undo();break;
    case 'typeBtn':flipType();break;
    case 'ftBtn':toggleFT();break;
    case 'printClubs':window.print();break;
    case 'copyClubs':copyText(clubText());break;
    case 'addP':{const i=$('#newName');const n=i.value.trim();if(!n)return;S.players.push({id:'p'+uid(),name:n,active:true});rosterChanged();renderSetup();toast(n+' added');break;}
    case 'csv':exportCSV();break;
    case 'syncNow':syncNow().then(()=>{toast(syncErr?'Could not reach the Google Sheet':'Saved to Drive');renderSetup();});break;
    case 'pull':pullFromSheet(true);break;
    case 'urlSave':{const v=$('#urlIn').value.trim();if(v&&!/^https:\/\/script\.google(usercontent)?\.com\//.test(v)){toast('That is not a Google Apps Script web app URL');return;}S.settings.sheetUrl=v;S.playersDirty=true;save();renderSetup();if(v){pullFromSheet(true).then(()=>syncNow());}break;}
    case 'delDay':{const n=S.shots.filter(s=>s.day===logDay).length;if(confirm(`Delete all ${n} shots from ${prettyDay(logDay)}?`)){const d=logDay;removeShots(s=>s.day===d);renderSetup();toast('Day deleted');}break;}
  }
});
document.addEventListener('change',e=>{
  const t=e.target,ds=t.dataset;
  if(t.id==='inact'){showInactive=t.checked;renderStats();return;}
  if(t.id==='plSel'){plId=t.value;renderPlayer();return;}
  if(t.id==='mgrIn'){S.settings.manager=t.value.trim();save();renderMgr();toast('Saved');return;}
  if(t.id==='logSel'){logDay=t.value;renderSetup();return;}
  if(ds.rename){const p=S.players.find(x=>x.id===ds.rename);const n=t.value.trim();if(p&&n){p.name=n;rosterChanged();toast('Saved');}else t.value=p?p.name:'';return;}
  if(ds.active){const p=S.players.find(x=>x.id===ds.active);if(p){p.active=t.checked;rosterChanged();}return;}
  if(ds.set){const v=parseInt(t.value,10);const lim={green:[1,100],min:[1,500],window:[1,120]}[ds.set];if(isNaN(v)){t.value=S.settings[ds.set];return;}S.settings[ds.set]=clamp(v,lim[0],lim[1]);t.value=S.settings[ds.set];save();toast('Club rules updated');}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='newName'&&e.key==='Enter'){$('#addP').click();return;}
  if(e.target.matches('input,select,textarea')||e.metaKey||e.ctrlKey||e.altKey||view!=='track')return;
  const k=e.key.toLowerCase();
  if(k==='m')chooseResult(true);else if(k==='n')chooseResult(false);else if(k==='f')toggleFT();else if(k==='t')flipType();else if(k==='z')undo();else return;
  e.preventDefault();
});
$('#court').addEventListener('pointerdown',e=>{e.preventDefault();courtTap(e);});
window.addEventListener('online',()=>{updateSync();syncNow();});
window.addEventListener('offline',updateSync);
setInterval(()=>{if(waitingCount()||S.playersDirty)syncNow();},30000);

/* ---------- full screen ---------- */
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement;}
function toggleFS(){
  const d=document.documentElement;
  try{
    if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else{const r=(d.requestFullscreen||d.webkitRequestFullscreen).call(d);if(r&&r.catch)r.catch(()=>toast('Full screen is blocked in this browser'));}
  }catch(e){toast('Full screen is blocked in this browser');}
}
function updFS(){$('#fsBtn').textContent=fsEl()?'Exit full screen':'Full screen';}
document.addEventListener('fullscreenchange',updFS);document.addEventListener('webkitfullscreenchange',updFS);

/* ---------- keep screen on during practice ---------- */
let wl=null;
async function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible'&&(!wl||wl.released))wl=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){render();if(view==='track')keepAwake();}});

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

save();drawCourt();render();
(async()=>{await pullFromSheet(false);syncNow();})();
})();
</script>
